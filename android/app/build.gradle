plugins { id 'com.android.application' }
android {
    namespace 'com.aven.calls'
    compileSdk 36
    defaultConfig {
        applicationId 'com.aven.calls'
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName '1.1.4'
        buildConfigField 'String', 'DEFAULT_SERVER_URL', groovy.json.JsonOutput.toJson(
            providers.gradleProperty('avenServerUrl')
                .orElse('').get())
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        distribution {
            if (System.getenv('AVEN_SIGNING_STORE')) {
                storeFile file(System.getenv('AVEN_SIGNING_STORE'))
                storePassword System.getenv('AVEN_SIGNING_PASSWORD')
                keyAlias 'aven-calls'
                keyPassword System.getenv('AVEN_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            buildConfigField 'String', 'DEFAULT_SERVER_URL', '"http://10.0.2.2:8010"'
        }
        release {
            minifyEnabled true
            shrinkResources true
            if (System.getenv('AVEN_SIGNING_STORE')) signingConfig signingConfigs.distribution
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError true; checkReleaseBuilds true }
}
configurations.configureEach { resolutionStrategy.activateDependencyLocking() }
dependencies {
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'androidx.work:work-testing:2.11.2'
}
