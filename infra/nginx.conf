# Keep the app shell, sign-in and customer enquiry forms out of search
# results. $request_uri is the original path, so this still applies after the
# SPA fallback rewrites $uri to /index.html.
map $request_uri $viacrm_robots {
    default "";
    "~^/(app|login|enquiry)(/|\?|$)" "noindex, nofollow";
    "~^/index\.html" "noindex";
    "~^/brand/" "noindex";
}
server {
    listen 80;
    # Relative redirects (e.g. /blog -> /blog/) so Caddy's HTTPS origin is kept.
    absolute_redirect off;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 65m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag $viacrm_robots always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    location /api/ {
        proxy_pass http://api:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 45s;
        proxy_connect_timeout 5s;
        proxy_request_buffering on;
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location = /release.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    # Single-page app routes. Every other path is a real file, a static
    # marketing page directory (/real-estate-crm/) or a true 404, so crawlers
    # never see soft-404s or robots.txt/sitemap.xml answered with the app shell.
    location = / { try_files /index.html =404; }
    location = /login { try_files /index.html =404; }
    location = /app { try_files /index.html =404; }
    location /app/ { try_files /index.html =404; }
    location /enquiry/ { try_files /index.html =404; }
    location /site/ {
        expires 7d;
        try_files $uri =404;
    }
    error_page 404 /404.html;
    location / { try_files $uri $uri/ =404; }
}
