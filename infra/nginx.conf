server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 65m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    location /api/ {
        proxy_pass http://api:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 45s;
        proxy_connect_timeout 5s;
        proxy_request_buffering on;
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location = /release.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location / { try_files $uri /index.html; }
}
